[project]
name = "myjoblauncher"
version = "1.0.0"
description = "Operational improvement Tool"
readme = "README.md"
authors = [
    { name = "UNiSON DATA LLC" },
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "duckdb>=1.5.3",
    "flet>=1.0.1",
    "markdown-it-py>=4.2.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pywin32>=312",
    "tomli-w>=1.2.0",
    "tzdata>=2026.3",
    "uuid6>=2025.0.1",
    "windows-curses>=2.4.1; sys_platform == 'win32'",
]

[project.license]
file = "LICENSE.txt"

[project.scripts]
mj = "main:main"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "gui/**/*.py",
    "services/**/*.py",
    "tui/**/*.py",
    "utils/**/*.py",
]
